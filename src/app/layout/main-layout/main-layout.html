<div class="app-shell">
  <app-sidebar />

  <div class="app-main">
    <header class="topbar">
      <div class="topbar-search">
        <app-icon name="search" [size]="16" />
        <input type="text" placeholder="Buscar hóspede, reserva ou fatura..." />
      </div>

      <div class="topbar-actions">
        <button type="button" class="icon-btn" aria-label="Notificações">
          <app-icon name="bell" [size]="18" />
          <span class="badge"></span>
        </button>
        <button type="button" class="icon-btn" aria-label="Sair">
          <app-icon name="log-out" [size]="18" />
        </button>
      </div>
    </header>

    <main class="content">
      <router-outlet />
    </main>
  </div>
</div>
