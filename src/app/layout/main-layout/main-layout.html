<div class="app-shell">
  <app-sidebar />

  <div class="app-main">
    <header class="topbar">
      <span class="topbar-user">{{ auth.user()?.name }}</span>

      <div class="topbar-actions">
        <button type="button" class="icon-btn" aria-label="Sair" (click)="logout()">
          <app-icon name="log-out" [size]="18" />
        </button>
      </div>
    </header>

    <main class="content">
      <router-outlet />
    </main>
  </div>
</div>
