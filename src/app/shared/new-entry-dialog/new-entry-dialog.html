<app-modal
  [title]="'Novo Lançamento'"
  [subtitle]="'Registre uma entrada ou saída no fluxo de caixa'"
  (closed)="close()"
>
  <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
    <div class="type-toggle">
      <button
        type="button"
        class="type-btn receita"
        [class.active]="type() === 'receita'"
        (click)="setType('receita')"
      >
        <app-icon name="arrow-up-right" [size]="16" />
        Receita
      </button>
      <button
        type="button"
        class="type-btn despesa"
        [class.active]="type() === 'despesa'"
        (click)="setType('despesa')"
      >
        <app-icon name="arrow-down-right" [size]="16" />
        Despesa
      </button>
    </div>

    <div class="field">
      <span>Forma de Pagamento</span>
      <div class="payment-toggle">
        @for (method of paymentMethods; track method) {
          <button
            type="button"
            class="payment-btn"
            [class.active]="paymentMethod() === method"
            (click)="setPaymentMethod(method)"
          >
            <app-icon [name]="paymentMethodIcon(method)" [size]="15" />
            {{ method }}
          </button>
        }
      </div>
    </div>

    <label class="field">
      <span>Descrição</span>
      <input
        type="text"
        formControlName="description"
        placeholder="Ex.: Faturamento reserva #112 - Maria Souza"
      />
      @if (submitted() && form.controls.description.invalid) {
        <small class="field-error">Informe uma descrição com pelo menos 3 caracteres.</small>
      }
    </label>

    <div class="field-row">
      <label class="field">
        <span>Categoria</span>
        <div class="select-wrap">
          <select formControlName="category">
            <option value="" disabled>Selecione</option>
            @for (category of categories(); track category) {
              <option [value]="category">{{ category }}</option>
            }
          </select>
          <app-icon name="chevron-down" [size]="14" />
        </div>
        @if (submitted() && form.controls.category.invalid) {
          <small class="field-error">Selecione uma categoria.</small>
        }
      </label>

      <label class="field">
        <span>Valor (R$)</span>
        <input type="number" formControlName="value" placeholder="0,00" min="0.01" step="0.01" />
        @if (submitted() && form.controls.value.invalid) {
          <small class="field-error">Informe um valor válido.</small>
        }
      </label>
    </div>

    <div class="field-row">
      <label class="field">
        <span>Data</span>
        <input type="date" formControlName="date" />
      </label>

      <label class="field">
        <span>Horário</span>
        <input type="time" formControlName="time" />
      </label>
    </div>

    <div class="dialog-actions">
      <button type="button" class="btn-secondary" (click)="close()">Cancelar</button>
      <button type="submit" class="btn-primary" [class.despesa]="type() === 'despesa'" [disabled]="saving()">
        @if (saving()) {
          <span class="spinner"></span>
          Salvando...
        } @else {
          <app-icon name="plus-circle" [size]="16" />
          Salvar Lançamento
        }
      </button>
    </div>
  </form>
</app-modal>
